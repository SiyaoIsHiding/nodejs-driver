name: Unit and Integration Tests for Apache Cassandra NodeJS Driver

on:
  push:
  pull_request:
  workflow_dispatch:   # allow manual trigger from Actions  page
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    env:
      CCM_VERSION: 3.11.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Python for ccm ----
      - name: Set up Python 3.9.16
        uses: actions/setup-python@v5
        with:
          python-version: '3.9.16'

      - name: Install ccm
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 --single-branch -b cassandra-test https://github.com/apache/cassandra-ccm.git
          cd cassandra-ccm
          pip install -r requirements.txt
          ./setup.py install
      
      # ---- Install required Zulu JDKs (8/11/17) and capture their homes ----
      - name: Install Zulu 8
        id: z8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Install Zulu 11
        id: z11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'
          
      - name: Install Zulu 17
        id: z17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Export JAVA*_HOME variables
        run: |
          echo "JAVA8_HOME=${{ steps.z8.outputs.path }}"  >> "$GITHUB_ENV"
          echo "JAVA11_HOME=${{ steps.z11.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.z17.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${{ steps.z8.outputs.path }}"    >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # ---- Print env vars before build ----
      - name: Print environment
        run: printenv | sort

      - name: Run tests
        run: |
          npm install
          npx mocha test/unit test/integration/short --recursive --exit --reporter json --reporter-option output=test-results.json                       
      
      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}       # run this step even if previous step failed
        with:
          name: Mocha Tests            # Name of the check run which will be created
          path: test-results.json    # Path to test results
          reporter: mocha-json        # Format of test results
